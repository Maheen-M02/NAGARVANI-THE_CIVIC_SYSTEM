<!DOCTYPE html>
<html>
<head>
    <title>Hotspot Connection Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: 0 auto; }
        .btn { background: #007AFF; color: white; border: none; padding: 15px 20px; border-radius: 8px; font-size: 16px; margin: 10px 0; width: 100%; }
        .result { margin: 15px 0; padding: 15px; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Hotspot Connection Test</h1>
        <p>Test CLIP server connection from your iPhone</p>
        
        <button class="btn" onclick="testConnection('192.168.137.1:8000')">
            Test Hotspot IP (192.168.137.1:8000)
        </button>
        
        <button class="btn" onclick="testConnection('10.227.86.94:8000')">
            Test WiFi IP (10.227.86.94:8000)
        </button>
        
        <button class="btn" onclick="testConnection('10.17.113.216:8000')">
            Test Old WiFi IP (10.17.113.216:8000)
        </button>
        
        <div id="results"></div>
    </div>

    <script>
        async function testConnection(ip) {
            const resultsDiv = document.getElementById('results');
            const url = `http://${ip}/health`;
            
            resultsDiv.innerHTML += `<div class="result info">Testing ${url}...</div>`;
            
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultsDiv.innerHTML += `
                        <div class="result success">
                            ✅ SUCCESS: ${url}<br>
                            Mode: ${data.mode}<br>
                            Model Loaded: ${data.model_loaded}<br>
                            Status: ${data.status}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML += `
                        <div class="result error">
                            ❌ HTTP Error: ${url}<br>
                            Status: ${response.status}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="result error">
                        ❌ FAILED: ${url}<br>
                        Error: ${error.message}
                    </div>
                `;
            }
        }
        
        // Auto-test on load
        window.onload = function() {
            document.getElementById('results').innerHTML = '<div class="result info">Ready to test connections...</div>';
        };
    </script>
</body>
</html>
